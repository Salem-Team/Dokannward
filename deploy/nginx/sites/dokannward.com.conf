# Dokan Ward — Next.js storefront + Laravel admin/API
# Canonical domain: dokannward.com (www redirects here)
# Next.js: 127.0.0.1:3010
# Laravel: PHP-FPM 8.3 (admin/public)
#
# Install:
#   sudo cp deploy/nginx/sites/dokannward.com.conf /etc/nginx/sites-available/dokannward.com
#   sudo ln -sfn /etc/nginx/sites-available/dokannward.com /etc/nginx/sites-enabled/dokannward.com
#   sudo certbot certonly --webroot -w /var/www/certbot -d dokannward.com -d www.dokannward.com --expand
#   sudo nginx -t && sudo systemctl reload nginx

upstream dokannward_next {
    server 127.0.0.1:3010;
    keepalive 32;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dokannward.com;

    client_max_body_size 4g;
    client_body_timeout 1800s;

    ssl_certificate /etc/letsencrypt/live/dokannward.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dokannward.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    include /etc/nginx/snippets/dokannward-app.conf;
}

# www → apex (certificate must include www.dokannward.com)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.dokannward.com;

    ssl_certificate /etc/letsencrypt/live/dokannward.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dokannward.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://dokannward.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name dokannward.com www.dokannward.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://dokannward.com$request_uri;
    }
}

# Legacy staging hostname → canonical domain (HTTP only; cert may be absent)
server {
    listen 80;
    listen [::]:80;
    server_name dokannward.rootk-eg.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://dokannward.com$request_uri;
    }
}
