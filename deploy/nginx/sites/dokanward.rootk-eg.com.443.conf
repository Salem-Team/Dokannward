server {
  listen 443 ssl;
  http2 on;
  server_name dokanward.rootk-eg.com;

  client_max_body_size 4g;
  client_body_timeout 1800s;

  ssl_certificate     /etc/letsencrypt/live/dokanward.rootk-eg.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dokanward.rootk-eg.com/privkey.pem;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  location = /api/revalidate {
    proxy_pass http://dokannward_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }

  location = /api/catalog-search {
    proxy_pass http://dokannward_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }

  location ^~ /storage/ {
    alias /var/www/dokannward/admin/storage/app/public/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    add_header Access-Control-Allow-Origin *;
  }

  location ^~ /build/ {
    alias /var/www/dokannward/admin/public/build/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /sw-admin.js {
    alias /var/www/dokannward/admin/public/sw-admin.js;
    access_log off;
    default_type application/javascript;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Service-Worker-Allowed "/admin";
  }

  location ^~ /images/brand/ {
    alias /var/www/dokannward/admin/public/images/brand/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public";
  }

  location ^~ /livewire/ {
    root /var/www/dokannward/admin/public;
    try_files $uri $uri/ /index.php?$query_string;
  }

  location ^~ /admin {
    root /var/www/dokannward/admin/public;
    try_files $uri $uri/ /index.php?$query_string;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-store" always;
  }

  location ^~ /api/ {
    root /var/www/dokannward/admin/public;
    try_files $uri $uri/ /index.php?$query_string;
  }

  location ~ ^/(admin|api|livewire).*\.php(?:$|/) {
    root /var/www/dokannward/admin/public;
    include fastcgi_params;
    fastcgi_pass unix:/run/php-fpm-dokannward/dokannward.sock;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTPS on;
    fastcgi_read_timeout 1800s;
  }

  location = /index.php {
    root /var/www/dokannward/admin/public;
    include fastcgi_params;
    fastcgi_pass unix:/run/php-fpm-dokannward/dokannward.sock;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param HTTPS on;
    fastcgi_read_timeout 1800s;
  }

  location ~ /\.(?!well-known) {
    deny all;
  }

  location / {
    proxy_pass http://dokannward_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
  }

  location /_next/static/ {
    proxy_pass http://dokannward_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    access_log off;
    expires 365d;
    add_header Cache-Control "public, immutable";
  }

  location /_next/image {
    proxy_pass http://dokannward_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }
}
