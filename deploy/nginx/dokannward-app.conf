# Shared Dokan Ward location blocks (included by HTTP + HTTPS server)

# Next.js ISR purge — must win over Laravel /api/
location = /api/revalidate {
    proxy_pass http://dokannward_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}

# Next.js slim search catalog — must win over Laravel /api/
location = /api/catalog-search {
    proxy_pass http://dokannward_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}

# Laravel public root for admin/api/storage/build/livewire
set $dokannward_laravel_root /var/www/dokannward/admin/public;

location ^~ /storage/ {
    alias /var/www/dokannward/admin/storage/app/public/;
    access_log off;
    expires 30d;
    # Not immutable: admin may replace bytes; versioned ?v= is the primary bust.
    add_header Cache-Control "public, max-age=2592000";
    add_header Access-Control-Allow-Origin *;
}

location ^~ /build/ {
    alias /var/www/dokannward/admin/public/build/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# Admin service worker — must not fall through to Next.js (404 HTML).
location = /sw-admin.js {
    alias /var/www/dokannward/admin/public/sw-admin.js;
    access_log off;
    default_type application/javascript;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Service-Worker-Allowed "/admin";
}

location ^~ /livewire/ {
    root /var/www/dokannward/admin/public;
    try_files $uri $uri/ /index.php?$query_string;
}

location ^~ /admin {
    root /var/www/dokannward/admin/public;
    try_files $uri $uri/ /index.php?$query_string;

    # OWASP secure headers (admin surface). App-level throttle + lockout
    # cover brute-force; put limit_req_zone in http {} if you also want nginx rate limits.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cache-Control "no-store" always;
}

location ^~ /api/ {
    root /var/www/dokannward/admin/public;
    try_files $uri $uri/ /index.php?$query_string;
}

# PHP front controller for Laravel routes above
location ~ ^/(admin|api|livewire).*\.php(?:$|/) {
    root /var/www/dokannward/admin/public;
    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTPS $https if_not_empty;
    fastcgi_read_timeout 1800s;
}

# Laravel index.php (try_files fallback)
location = /index.php {
    root /var/www/dokannward/admin/public;
    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param HTTPS $https if_not_empty;
    fastcgi_read_timeout 1800s;
}

# Deny hidden / env
location ~ /\.(?!well-known) {
    deny all;
}


# Admin brand logos live in Laravel public — must not hit Next.js 404
location ^~ /images/brand/ {
    alias /var/www/dokannward/admin/public/images/brand/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public";
}

# Storefront (Next.js)
# Security headers; Next ISR owns Cache-Control (s-maxage) for HTML.
location / {
    proxy_pass http://dokannward_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
}

location /_next/static/ {
    proxy_pass http://dokannward_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    access_log off;
    expires 365d;
    add_header Cache-Control "public, immutable";
}

# Image optimizer — never let Next.js pin 4xx as immutable for a year
# (Safari then shows a broken plate until the shopper hard-refreshes).
location /_next/image {
    proxy_pass http://dokannward_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    access_log off;
    proxy_intercept_errors on;
    error_page 400 403 404 415 500 502 503 504 = @next_image_uncached_error;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
}

location @next_image_uncached_error {
    internal;
    add_header Cache-Control "no-store, must-revalidate" always;
    add_header Content-Type "text/plain; charset=utf-8" always;
    return 404 "image unavailable";
}
