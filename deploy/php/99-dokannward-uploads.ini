; Product photo uploads (admin). Applied by scripts/rebuild-production.sh.
; High ceilings so large studio RAW/JPEG exports can upload without silent 413/empty POST.
upload_max_filesize = 2048M
post_max_size = 4096M
memory_limit = 1024M
max_file_uploads = 50
max_execution_time = 1800
max_input_time = 1800
